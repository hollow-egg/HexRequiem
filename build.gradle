plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'org.jetbrains.kotlin.jvm'

}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "hexrequiem" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.terraformersmc.com/releases" }
    maven { url "https://maven.shedaniel.me/" }

    // Hex Casting Dependencies
    maven { url "https://maven.hexxy.media" }
    maven { url "https://maven.blamejared.com/" }
    maven { url "https://mvn.devos.one/snapshots/" }
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    maven { url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1' }
    // Add any other repositories with your cross-platform dependency mods
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation("net.fabricmc:fabric-language-kotlin:${project.fabricKotlinVersion}")

    // Hex Casting stuff
    modImplementation("at.petra-k.hexcasting:hexcasting-fabric-${minecraft_version}:${hexcastingVersion}")


    modImplementation "at.petra-k.paucal:paucal-fabric-${minecraft_version}:${paucalVersion}"
    modImplementation "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouliVersion}-FABRIC"
    modRuntimeOnly "me.shedaniel.cloth:cloth-config-fabric:${clothConfigVersion}"
    modRuntimeOnly("com.samsthenerd.inline:inline-fabric:${inlineVersion}") { transitive = false }
    modRuntimeOnly 'me.djtheredstoner:DevAuth-fabric:1.2.1'

    localRuntime "io.github.llamalad7:mixinextras-fabric:${mixinExtrasVersion}"
    include "io.github.llamalad7:mixinextras-fabric:${mixinExtrasVersion}"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${mixinExtrasVersion}"
    modLocalRuntime "io.github.tropheusj:serialization-hooks:${serializationHooksVersion}"

    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-api:${cardinalComponentsVersion}"

    modImplementation files("libs/requiem-2.0.0-beta.17.jar")
    modImplementation files("libs/blabber-1.5.1-mc1.20.1.jar")
    modImplementation files("libs/automatone-0.11.0-fabric-bridge.jar")
    modImplementation files("libs/Requiem-API-2.0.0-beta.17.jar")
    modImplementation files("libs/requiem-core-2.0.0-beta.17.jar")
    modImplementation files("libs/vaquero-2.0.0-beta.17.jar")
    modImplementation files("libs/satin-1.14.0.jar")
    modImplementation files("libs/reach-entity-attributes-2.4.0.jar")
    modImplementation files("libs/PlayerAbilityLib-1.8.0.jar")
    modImplementation files("libs/locki-0.11.1-fabric-bridge.jar")
    modImplementation files("libs/impersonate-2.10.2.jar")
    modImplementation files("libs/fabric-permissions-api-0.3.1.jar")
    modImplementation files("libs/fiber-0.23.0-2.jar")
    modImplementation files("libs/chime-cec3bcbaed508eb5f564deac8c33923dcccfdf7e.jar")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
kotlin {
    jvmToolchain(17)
}